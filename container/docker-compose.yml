services:

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev
    env_file:
      - .env-keycloak
    networks:
      - internal
      - external
    ports:
      - 8080:8080
    volumes:
      # 経費申請アプリ(app-expense-claim)専用のログイン画面のテーマ
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      # ref) https://gist.github.com/sarath-soman/5d9aec06953bbd0990c648605d4dba07
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $$? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 3s
      timeout: 10s
      retries: 60
    restart: unless-stopped

#  以下の2つは、RPとRSを体験するためのアプリ(webapp/ のGradleマルチプロジェクト)。
#  ソースを読み取り専用で取り込み、コンテナ内でビルドして起動する。
#  初回はライブラリの取得に数分かかる(以降はGradleキャッシュのボリュームで高速化)。
#  ソースを編集したら `docker compose restart relying-party resource-server` で反映する。

  resource-server:
    container_name: resource-server
    image: eclipse-temurin:21
    networks:
      - external
    ports:
      - 8111:8111
    volumes:
      - ../webapp:/src:ro
      - gradle-cache-rs:/root/.gradle
    working_dir: /webapp
    command: sh -c "rm -rf /webapp/*/src && cp -a /src/. /webapp/ && ./gradlew :resource-server:bootRun --console=plain"
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  relying-party:
    container_name: relying-party
    image: eclipse-temurin:21
    networks:
      - external
    ports:
      - 8222:8222
    volumes:
      - ../webapp:/src:ro
      - gradle-cache-rp:/root/.gradle
    working_dir: /webapp
    command: sh -c "rm -rf /webapp/*/src && cp -a /src/. /webapp/ && ./gradlew :relying-party:bootRun --console=plain"
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:13.0.1
    environment:
      # OIDC連携(Generic OAuth)はハンズオン体験者がGrafanaの管理画面から設定する。リダイレクトURIの生成に必要なため、ここだけ設定しておく
      GF_SERVER_ROOT_URL: http://localhost:3000/
    networks:
      - external
    ports:
      - 3000:3000
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  nextcloud:
    container_name: nextcloud
    image: nextcloud:34.0.3
    environment:
      # SQLITE_DATABASEが無いと自動インストールされず、フックも実行されない
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: password
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      # 初回インストール後にSAML連携用の`user_saml`アプリを導入する(IdP/SP設定は体験者が行う)
      - ./nextcloud/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
    networks:
      - external
    ports:
      - 8081:80
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    name: intra-net
    driver: bridge
    internal: true
  external:
    name: hands-net
    driver: bridge

volumes:
  # `down -v`で消えないように外部ボリュームにする(CREATE_CONTAINER.shが作成する)。
  # Gradleのロックはコンテナ間で共有できないため、コンテナごとに分ける
  gradle-cache-rs:
    name: hands-gradle-cache-rs
    external: true
  gradle-cache-rp:
    name: hands-gradle-cache-rp
    external: true
