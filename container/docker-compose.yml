version: '3.8'

services:

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:25.0.4
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KC_ADM_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADM_PASS}
    networks:
      - hnet
    ports:
      - 8080:8080
    healthcheck:
      # ref) https://gist.github.com/sarath-soman/5d9aec06953bbd0990c648605d4dba07
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $$? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 3s
      timeout: 10s
      retries: 60

  ressvr:
    container_name: ressvr
    image: eclipse-temurin:21
    networks:
      - hnet
    ports:
      - 8111:8111
    volumes:
      - ./resource-server:/webapi
    working_dir: /webapi
    command: ./mvnw spring-boot:run
    tty: true
    depends_on:
      keycloak:
        condition: service_healthy

networks:
  hnet:
    name: hands-net
    driver: bridge

