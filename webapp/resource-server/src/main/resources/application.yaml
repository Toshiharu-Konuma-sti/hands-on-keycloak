server:
  port: 8091

spring:
  application:
    name: apisl.handson.keycloak.ressrv
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak側のRealm名に合わせて変更してください（例: myrealm）
          # コンテナ外から起動する場合は localhost、コンテナ間通信ならコンテナ名
          issuer-uri: http://localhost:8080/realms/handson
