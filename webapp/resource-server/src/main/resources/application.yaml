server:
  port: 8091

spring:
  application:
    name: apisl.handson.keycloak.ressrv
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/handson
        opaquetoken:
          introspection-uri: http://localhost:8080/realms/handson/protocol/openid-connect/token/introspect
          client-id: my-resource-server-client
          client-secret: ${OPAQUE_CLIENT_SECRET}